[platformio]
; 地域ごとのファームウェアをまとめてビルドする (出力: .pio/build/<環境名>/PicoCMT_<地域>.uf2)
default_envs = rpipico_ww, rpipico_jp

; 実機用の共通設定
[rpipico_common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower

board_build.arduino.earlephilhower.usb_manufacturer = Raspberry Pi
board_build.arduino.earlephilhower.usb_product = Pico W

build_flags =
	-DUSBCON
    -D ENABLE_DEBUG_LOG

extra_scripts =
	pre:scripts/generate_pio_headers.py
	pre:scripts/firmware_name.py
lib_deps =
	adafruit/Adafruit GFX Library @ ^1.11.11
	adafruit/Adafruit SSD1306 @ ^2.5.13

; Wi-Fiの国設定ごとの環境 (WIFICC で使えるチャンネル・出力が決まる)
; 全世界共通: どの国でも使える。チャンネル12・13は受信のみで探す。時刻は UTC (NTP: pool.ntp.org)
[env:rpipico_ww]
extends = rpipico_common
custom_fw_region = WW
build_flags =
	${rpipico_common.build_flags}
	-DWIFICC=CYW43_COUNTRY_WORLDWIDE

; 日本: チャンネル1〜13、時刻は日本時間 (NTP: ntp.nict.jp)
[env:rpipico_jp]
extends = rpipico_common
custom_fw_region = JP
build_flags =
	${rpipico_common.build_flags}
	-DWIFICC=CYW43_COUNTRY_JAPAN
	-DFW_REGION_JP

; PC上でのテスト (pio test -e native)。PATHに g++ が必要
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
	-<*>
	+<cmt_sd_buffer.cpp>
	+<cmt_cmt_converter.cpp> +<cmt_t88_converter.cpp> +<cmt_cas_converter.cpp> +<cmt_t77_converter.cpp>
	+<player_cmt.cpp> +<player_t88.cpp> +<player_cas.cpp> +<player_t77.cpp>
	+<cmt_p6t_format.cpp> +<cmt_p6t_converter.cpp> +<player_p6t.cpp>
	+<cmt_web_util.cpp>
build_flags =
	-std=gnu++17
	-I test/mocks
	-I test/helpers
	-D UNITY_INCLUDE_DOUBLE
